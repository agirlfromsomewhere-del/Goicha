<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12141a" />
    <meta name="description" content="An accessible flashcard spaced-repetition app for Japanese learners" />
    <!--
      GitHub Pages doesn't let us set real HTTP response headers, so this
      meta tag is the only way to apply a CSP on static hosting. Scoped to
      exactly what the app needs: its own same-origin script/style/data,
      YouTube's official iframe embed + player script for video capture,
      and the YouTube Data API for the usage-check/flashcard features.
      Note: frame-ancestors can't be set via meta tag (spec requires a real
      header for that directive), so it's intentionally omitted rather than
      included as a no-op.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.youtube.com; worker-src 'self'; frame-src https://www.youtube.com; connect-src 'self' https://www.googleapis.com; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cardwise</title>
  </head>
  <body>
    <div id="announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
